<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Password Reset</title>
    <style>
        .otp-box {
            background: #f8f9fa;
            border: 2px dashed #dc3545;
            border-radius: 6px;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
        }

        .otp-box span {
            font-size: 32px;
            font-weight: bold;
            color: #dc3545;
            font-family: 'Courier New', monospace;
            letter-spacing: 6px;
        }
    </style>
</head>
<body>

<h2>Password Reset Request</h2>

<p>We received a request to reset your password.</p>

<p>Please use the 6-digit OTP below to reset your password:</p>

<div class="otp-box">
    <span th:text="${resetUrl}">OTP</span>
</div>

<p>Enter this OTP in the app to reset your password.</p>

<p>If you didn't request this, you can safely ignore this email.</p>

</body>
</html>
