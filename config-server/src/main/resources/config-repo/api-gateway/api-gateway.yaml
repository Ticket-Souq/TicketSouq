server:
  port: 8080

database:
  host: ${DATABASE_HOST}
  port: ${DATABASE_PORT}
  name: auth_db
  username: admin
  password: admin


kafka:
  group-id: auth_service

spring:
  cloud:
    gateway:
      httpclient:
        connect-timeout: 5000
        response-timeout: 30s
  data:
    redis:
      host: ${redis.host}
      port: ${redis.port}

jwt:
  secret: ${JWT_SECRET:changeme-this-must-be-at-least-32-bytes-long-for-sha256}
  access-token-expiry-ms: ${JWT_ATX:300000}    # 5 minutes
  email-token-expiry-ms: ${JWT_ETX:300000}   # 5 minutes
  password-reset-expiry-ms: ${JWT_PTX:300000}   # 5 minutes
  refresh-token-expiry-ms: ${JWT_RTX:604800000}  # 7 day
  issuer: ticket-souq

app:
  generated-email-domain: ${GENERATED_EMAIL_DOMAIN:ticketaty.com}

rate-limit:
  paths: /**
  capacity: ${RATE_LIMIT:20}
  refill: ${RATE_LIMIT:20}
  refill-period: 1m
  allowed-origins:
    - http://${frontend.host}:${frontend.port}



springdoc:
  swagger-ui:
    urls:
      - name: Auth Service
        url: /aggregate/api-gateway/v3/api-docs
      - name: User Service
        url: /aggregate/user-service/v3/api-docs
      - name: Audit Service
        url: /aggregate/audit-service/v3/api-docs
      - name: Analytics Service
        url: /aggregate/analytics-service/v3/api-docs
      - name: Event Service
        url: /aggregate/event-service/v3/api-docs
      - name: Notification Service
        url: /aggregate/notification-service/v3/api-docs
      - name: Payment Service
        url: /aggregate/payment-service/v3/api-docs
      - name: Reservation Service
        url: /aggregate/reservation-service/v3/api-docs
      - name: Ticket Service
        url: /aggregate/ticket-service/v3/api-docs
      - name: Venue Service
        url: /aggregate/venue-service/v3/api-docs
