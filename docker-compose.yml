    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      analytics-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8089/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    networks:
      - Ticket-Souq-Microservice

  # ─── Frontend ──────────────────────────────────────────────

  frontend:
    build:
      context: ../client-side
      dockerfile: Dockerfile
      args:
#        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_GRAFANA_URL: ${VITE_GRAFANA_URL:-http://localhost:3000}
        VITE_BRAND_NAME: ${VITE_BRAND_NAME:-Ticketaty}
        VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-support@ticketaty.com}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-pk_test_51TUAICJ0xQ4cACneRblBTSum5IAEMMrXurm7n9tkwzXH9szilEgK1YmeBozcIl3NTeraayns9IEXNyc369Iizt2j00guZYejTZ}
    container_name: frontend
    ports:
      - "8081:80"
#    depends_on:
#      api-gateway:
#        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
